<div class="remainder-section glass-card">
  <label class="input-label">{{ 'sale.remainder_label' | translate }}</label>

  <div class="remainder-options">
    @for (option of options; track option.policy) {
      <div
        class="remainder-option"
        [class.active]="policy() === option.policy"
        (click)="select(option.policy)"
      >
        <span class="remainder-radio" aria-hidden="true"></span>
        <div class="remainder-copy">
          <span class="remainder-title">{{ option.titleKey | translate }}</span>
          <span class="remainder-desc">
            {{ option.descriptionKey | translate: { amount: pricing.minOrderKopecks() / 100 } }}
          </span>
        </div>
      </div>
    }
  </div>
</div>
