<h2 class="page-title">{{ 'sale.method_title' | translate }}</h2>
<p class="page-lead">{{ 'sale.method_lead' | translate }}</p>

<!--
  The two marks come from `app-sale-method-icon`, shared with the history list
  on the dashboard — a row there has to answer "which of these was this?", and a
  second copy of the paths is how the two come to differ by a stroke width
  nobody notices for months.
-->
<div class="methods">
  <app-method-tile link="/sale/jar" titleKey="sale.method_jar" hintKey="sale.method_jar_hint">
    <app-sale-method-icon [method]="SaleMethod.JAR" />
  </app-method-tile>

  <app-method-tile link="/sale/card" titleKey="sale.method_card" hintKey="sale.method_card_hint">
    <app-sale-method-icon [method]="SaleMethod.CARD" />
  </app-method-tile>
</div>
