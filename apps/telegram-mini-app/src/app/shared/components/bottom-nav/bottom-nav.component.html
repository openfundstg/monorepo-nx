<nav class="bottom-nav" [appTourAnchor]="TourStep.NAV">
  <!--
    `exact: true` on Home only: every route is a child of '/', so without it the
    Home item would stay highlighted on the settings screen too.
  -->
  <a
    routerLink="/"
    [appTrackTap]="PixelTapEvent.NAV_DASHBOARD"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="nav-item"
  >
    <span class="nav-icon" aria-hidden="true">🏠</span>
    <span>{{ 'nav.home' | translate }}</span>
  </a>
  <a
    routerLink="/referral"
    [appTrackTap]="PixelTapEvent.NAV_REFERRAL"
    routerLinkActive="active"
    class="nav-item"
  >
    <span class="nav-icon" aria-hidden="true">🎁</span>
    <span>{{ 'nav.referral' | translate }}</span>
  </a>
  <a
    routerLink="/settings"
    [appTrackTap]="PixelTapEvent.NAV_SETTINGS"
    routerLinkActive="active"
    class="nav-item"
  >
    <span class="nav-icon" aria-hidden="true">⚙️</span>
    <span>{{ 'nav.settings' | translate }}</span>
  </a>
</nav>
