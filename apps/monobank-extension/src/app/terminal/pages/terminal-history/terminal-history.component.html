<div class="terminal-history">
  <div class="history-header">
    <div class="header-left">
      <h2>{{ 'HISTORY.TITLE' | translate }}</h2>
      @if (currentTerminal()?.terminalName) {
        <span
          class="terminal-name-badge"
          [class]="'provider-' + (currentTerminal()?.bankProvider || 'MONO')"
          >{{ currentTerminal()?.terminalName }}</span
        >
      }
    </div>

    <div class="header-right">
      @if (currentTerminal()?.lastUpdated) {
        <span class="last-updated-text" [title]="'DASHBOARD.UPDATED' | translate">
          {{ currentTerminal()?.lastUpdated | date: 'HH:mm:ss' }}
        </span>
      }

      @if (isPollingActive()) {
        <div class="polling-indicator" [title]="'DASHBOARD.TOOLTIPS.POLLING' | translate">
          <span class="ping"></span>
          <span class="dot"></span>
        </div>
      } @else {
        <button
          class="icon-btn sync-btn"
          [class.spinning]="isSyncing()"
          (click)="syncTerminal($event)"
          [title]="'DASHBOARD.TOOLTIPS.SYNC' | translate"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          </svg>
        </button>
      }
    </div>
  </div>

  <!--
    The table itself is `@transacto/history-table`, shared with the admin panel.
    Everything above stays here: the terminal name, the polling indicator and
    the sync button are this app's, and none of them means anything to an
    operator looking at somebody else's jar.
  -->
  <lib-history-table [logs]="logs()" [loading]="loading()" [error]="error()" />
</div>
