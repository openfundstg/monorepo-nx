<app-page-header title="sales.title" subtitle="sales.subtitle">
  <app-search-field
    [value]="state().search"
    placeholder="sales.search_placeholder"
    (search)="onSearch($event)"
  />
</app-page-header>

<app-book-filters
  list="sales"
  variantLabel="sales.variant"
  [variants]="variants"
  [statuses]="statuses"
  (apply)="onFilters($event)"
/>

<app-collection-table
  [rowId]="rowId"
  [rowClass]="rowClass"
  [columns]="columns"
  [rows]="state().items"
  [total]="state().total"
  [page]="state().page"
  [limit]="state().limit"
  [loading]="state().loading"
  [error]="state().error"
  [sort]="state().sort"
  [direction]="state().direction"
  [pendingCount]="state().pendingCount"
  [actions]="rowActions"
  emptyMessage="sales.empty"
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
  (refresh)="onRefresh()"
  (rowAction)="onAction($event)"
/>
