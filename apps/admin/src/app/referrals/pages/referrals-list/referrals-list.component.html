<app-page-header title="referrals.title" subtitle="referrals.subtitle">
  <app-search-field
    [value]="state().search"
    placeholder="referrals.search_placeholder"
    (search)="onSearch($event)"
  />
</app-page-header>

<app-collection-table
  [columns]="columns"
  [rows]="state().items"
  [total]="state().total"
  [page]="state().page"
  [limit]="state().limit"
  [loading]="state().loading"
  [error]="state().error"
  [sort]="state().sort"
  [direction]="state().direction"
  [pendingCount]="state().pendingCount"
  emptyMessage="referrals.empty"
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
  (refresh)="onRefresh()"
/>
