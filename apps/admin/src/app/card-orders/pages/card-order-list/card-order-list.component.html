<app-page-header title="card_orders.title" subtitle="card_orders.subtitle">
  <!--
    The search box is the lookup this screen exists for: an operator arrives
    from Transacto's panel holding an order number and nothing else.
  -->
  <app-search-field
    [value]="state().search"
    placeholder="card_orders.search_placeholder"
    (search)="onSearch($event)"
  />
</app-page-header>

<app-collection-table
  [columns]="columns"
  [actions]="actions"
  [rows]="state().items"
  [total]="state().total"
  [page]="state().page"
  [limit]="state().limit"
  [loading]="state().loading"
  [error]="state().error"
  [sort]="state().sort"
  [direction]="state().direction"
  [pendingCount]="state().pendingCount"
  emptyMessage="card_orders.empty"
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
  (rowAction)="onAction($event)"
  (refresh)="onRefresh()"
/>
