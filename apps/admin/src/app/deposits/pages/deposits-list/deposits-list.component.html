<app-page-header title="deposits.title" subtitle="deposits.subtitle">
  <app-filter-chips [chips]="filters" [active]="state().filter" (select)="onFilter($event)" />
  <app-search-field
    [value]="state().search"
    placeholder="deposits.search_placeholder"
    (search)="onSearch($event)"
  />
</app-page-header>

<app-collection-table
  [rowId]="rowId"
  [columns]="columns"
  [rows]="state().items"
  [total]="state().total"
  [page]="state().page"
  [limit]="state().limit"
  [loading]="state().loading"
  [error]="state().error"
  [sort]="state().sort"
  [direction]="state().direction"
  [pendingCount]="state().pendingCount"
  [actions]="rowActions"
  emptyMessage="deposits.empty"
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
  (refresh)="onRefresh()"
  (rowAction)="onAction($event)"
/>
