<h2 mat-dialog-title>{{ data.title | translate }}</h2>

<mat-dialog-content>
  <p class="message">{{ data.message | translate: data.messageParams }}</p>

  <mat-form-field appearance="outline" class="full">
    <mat-label>{{ 'common.reason' | translate }}</mat-label>
    <textarea matInput rows="3" [formControl]="reason" cdkFocusInitial></textarea>
    <mat-hint>{{ 'common.reason_hint' | translate }}</mat-hint>
    @if (reason.touched && reason.hasError('required')) {
      <mat-error>{{ 'common.reason_required' | translate }}</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>{{ 'common.cancel' | translate }}</button>
  <button
    mat-flat-button
    type="button"
    [color]="data.destructive ? 'warn' : 'primary'"
    (click)="confirm()"
  >
    {{ data.confirmLabel | translate }}
  </button>
</mat-dialog-actions>
