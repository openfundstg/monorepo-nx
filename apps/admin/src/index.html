<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Open Funds Admin</title>
    <!--
    Rewritten by the build to `/admin/`, so every hashed bundle and every lazy
    chunk is requested under that prefix. Without it the app would ask for
    `/main-*.js` at the domain root, where the Mini App is served, and get its
    `index.html` back instead.
  -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
    Linked rather than `@import`-ed from `styles.scss`: a plain-CSS `@import` is
    only honoured before every other rule, and that stylesheet opens with the
    design tokens.
  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
